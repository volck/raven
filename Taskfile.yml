version: '3'

# Taskfile for raven. Run with `task <name>` (https://taskfile.dev).

vars:
  LOGPARSER_PKG: ./cmd/logparser
  RAVEN_PKG: ./cmd/raven
  FLOCK_PKG: ./cmd/flock
  WRANGLER_PKG: ./cmd/wrangler
  KO_DOCKER_REPO: '{{.KO_DOCKER_REPO | default "ghcr.io/volck/raven"}}'
  HARBOR_PROJECT: '{{.HARBOR_PROJECT | default "harbor.norsk-tipping.no/raven"}}'

tasks:
  test:
    desc: Run all tests with race detector and shuffled order.
    cmds:
      - go test -race -shuffle=on ./...

  test:cover:
    desc: Run all tests with coverage report.
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    desc: Run go vet and gofmt check.
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  run:logparser:
    desc: Run logparser locally (requires LOGPARSER_CONFIG env).
    cmds:
      - go run {{.LOGPARSER_PKG}}

  run:raven:
    desc: Run raven locally.
    cmds:
      - go run {{.RAVEN_PKG}}

  run:flock:
    desc: Run flock locally (requires LOGPARSER_URL).
    cmds:
      - go run {{.FLOCK_PKG}}

  build:logparser:
    desc: Build the logparser container image with ko (local).
    env:
      KO_DOCKER_REPO: '{{.KO_DOCKER_REPO}}'
    cmds:
      - ko build --local --bare {{.LOGPARSER_PKG}}

  build:logparser:binary:
    desc: Build a static linux/amd64 binary at bin/raven-logparser (for Ansible deploy).
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags="-s -w" -o bin/raven-logparser {{.LOGPARSER_PKG}}
      - file bin/raven-logparser

  build:raven:
    desc: Build the raven container image with ko (local).
    env:
      KO_DOCKER_REPO: '{{.KO_DOCKER_REPO}}'
    cmds:
      - ko build --local --bare {{.RAVEN_PKG}}

  push:logparser:
    desc: Build & push the logparser container image with ko.
    env:
      KO_DOCKER_REPO: '{{.KO_DOCKER_REPO}}'
    cmds:
      - ko build --bare {{.LOGPARSER_PKG}}

  push:raven:
    desc: Build & push the raven container image with ko.
    env:
      KO_DOCKER_REPO: '{{.KO_DOCKER_REPO}}'
    cmds:
      - ko build --bare {{.RAVEN_PKG}}

  build:flock:
    desc: Build the flock container image with ko (local).
    env:
      KO_DOCKER_REPO: '{{.KO_DOCKER_REPO}}'
    cmds:
      - ko build --local --bare {{.FLOCK_PKG}}

  build:flock:binary:
    desc: Build a static linux/amd64 binary at bin/raven-flock (for Ansible deploy).
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags="-s -w" -o bin/raven-flock {{.FLOCK_PKG}}
      - file bin/raven-flock

  build:wrangler:
    desc: Build the wrangler container image with ko (local).
    env:
      KO_DOCKER_REPO: '{{.KO_DOCKER_REPO}}'
    cmds:
      - ko build --local --bare {{.WRANGLER_PKG}}

  push:wrangler:
    desc: Build & push the wrangler container image with ko to ghcr and harbor.
    cmds:
      # ko is reproducible, so both registries end up with the same digest.
      # --bare means KO_DOCKER_REPO is the whole image name, so Harbor needs
      # the repository appended to the project.
      - KO_DOCKER_REPO='{{.KO_DOCKER_REPO}}' ko build --bare {{.WRANGLER_PKG}}
      - KO_DOCKER_REPO='{{.HARBOR_PROJECT}}/wrangler' ko build --bare {{.WRANGLER_PKG}}

  push:flock:
    desc: Build & push the flock container image with ko.
    env:
      KO_DOCKER_REPO: '{{.KO_DOCKER_REPO}}'
    cmds:
      - ko build --bare {{.FLOCK_PKG}}

  ci:
    desc: Run the full CI pipeline (lint + test).
    cmds:
      - task: lint
      - task: test
